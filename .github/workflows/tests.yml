name: InventoryIQ Automated Testing & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-and-integration:
    name: Unit & Integration Tests (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./react-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './react-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Vitest Unit & Integration Suites
        run: npm run test

      - name: Compute Code Coverage
        run: npm run test:coverage

      - name: Build Production Bundle
        run: npm run build

      - name: Archive Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: ./react-frontend/coverage/

  e2e:
    name: End-to-End Tests (Playwright)
    needs: unit-and-integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./react-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './react-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test --project="Desktop Chrome"
        env:
          CI: true

      - name: Archive Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./react-frontend/playwright-report/
